<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betty's · the panel on a phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#fafafa; --surface:#fff;
    --ink:#000; --ink-strong:#171717; --muted:#666; --subtle:#8f8f8f; --faint:#b3b3b3;
    --line:#eaeaea; --line-strong:#d4d4d4; --wash:#f2f2f2; --wash-light:#fafafa;
    --accent:#0070f3; --danger:#ee0000; --warn:#f5a623;
    --shadow-card:0 1px 2px rgba(0,0,0,.03);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f0f0f0;color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .mono{font-family:'Geist Mono',ui-monospace,monospace}

  #chrome{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #chrome .grp{display:flex;gap:4px;padding:4px;background:var(--wash-light);border:1px solid var(--line);border-radius:10px}
  #chrome .grp button{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted);padding:7px 11px;border-radius:7px;white-space:nowrap}
  #chrome .grp button.on{background:var(--ink-strong);color:#fff}
  #tag{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--subtle);text-transform:uppercase;margin-right:auto}
  #desc{width:100%;font-size:13px;color:var(--muted);text-wrap:pretty;line-height:1.6;max-width:1180px}
  #desc b{color:var(--ink);font-weight:500}
  #stage{padding:26px 16px 70px;display:flex;justify-content:center}
  .row{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .one{display:flex;flex-direction:column;align-items:center}
  .capt{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--subtle);text-transform:uppercase;margin-bottom:9px}

  /* ── the phone ────────────────────────────────────────────────── */
  .phone{width:390px;height:800px;background:var(--canvas);border:10px solid #111;border-radius:36px;
    overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(0,0,0,.22)}
  .status{height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    font-family:'Geist Mono',monospace;font-size:10px;color:var(--ink);background:transparent;position:relative;z-index:3}
  .home{height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
  .home i{width:120px;height:4px;border-radius:2px;background:#111;opacity:.28}

  /* ── mobile type scale: bigger than the 334px desktop panel ───── */
  .mhdr{flex-shrink:0;background:var(--surface);padding:6px 16px 10px;display:flex;align-items:center;gap:10px}
  .mtitle{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .mcount{font-family:'Geist Mono',monospace;font-size:11px;color:var(--subtle)}
  .iconbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);flex-shrink:0;border:1px solid var(--line);background:var(--surface)}
  .iconbtn.plain{border-color:transparent}
  .iconbtn.solid{background:var(--ink-strong);color:#fff;border-color:var(--ink-strong)}

  .mseg{display:flex;gap:3px;padding:3px;background:var(--wash);border-radius:11px;margin:0 16px 10px}
  .mseg button{flex:1;padding:8px 8px;border-radius:8px;font-size:13.5px;color:var(--muted)}
  .mseg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-card)}

  .mtabs{display:flex;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;padding:11px 0 10px;font-size:14px;color:var(--subtle);position:relative}
  .mtabs button.on{color:var(--ink);font-weight:500}
  .mtabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--ink-strong);border-radius:2px}

  .mfilter{flex-shrink:0;padding:0 16px 10px}
  .mfilter .box{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:8px;
    font-size:13.5px;color:var(--faint);background:var(--surface)}

  .mlist{flex:1;min-height:0;overflow:hidden;background:var(--surface)}
  .msh{padding:16px 16px 6px;display:flex;align-items:center;gap:7px}
  .msh .lbl{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--subtle);text-transform:uppercase}
  .msh .cnt{font-family:'Geist Mono',monospace;font-size:10px;color:var(--faint)}
  .msh .chev{margin-left:auto;color:var(--faint);display:flex}
  .msh .act{margin-left:auto;font-size:12.5px;color:var(--subtle)}

  .mrow{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--wash);align-items:flex-start}
  .mbox{width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;background:var(--surface)}
  .mbox.done{background:var(--ink-strong);border-color:var(--ink-strong);color:#fff}
  .mtxt{flex:1;min-width:0}
  .mtxt .t{font-size:14.5px;line-height:1.4;text-wrap:pretty;letter-spacing:-.005em}
  .mrow.isdone .t{color:var(--subtle);text-decoration:line-through}
  .mmeta{display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .chip{font-family:'Geist Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px;background:var(--wash);color:var(--subtle)}
  .chip.money{background:rgba(238,0,0,.06);color:var(--danger)}
  .when{font-family:'Geist Mono',monospace;font-size:10px;color:var(--faint)}
  .mdel{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex-shrink:0}
  .mundo{font-size:12.5px;color:var(--accent);white-space:nowrap;flex-shrink:0;padding-top:1px}
  .mnote{padding:12px 16px;border-top:1px solid var(--wash);display:flex;gap:12px}
  .mnote .bar{width:3px;border-radius:2px;background:var(--warn);flex-shrink:0}
  .mnote .t{flex:1;min-width:0;font-size:14.5px;line-height:1.45;color:var(--muted);text-wrap:pretty}
  .mmore{width:100%;padding:12px 16px;border-top:1px solid var(--wash);text-align:left;font-size:13.5px;color:var(--accent)}

  /* composer, docked to the bottom edge */
  .mcomp{flex-shrink:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 8px}
  .mchips{display:flex;gap:6px;margin-bottom:9px}
  .mchips button{font-size:12.5px;padding:6px 13px;border-radius:9px;color:var(--subtle);border:1px solid var(--line)}
  .mchips button.on{background:var(--ink-strong);color:#fff;border-color:var(--ink-strong)}
  .minput{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:14.5px;
    color:var(--faint);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface)}
  .minput.focus{border-color:var(--ink-strong)}
  .minput .send{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--ink-strong);color:#fff;flex-shrink:0}
  .minput .send.off{background:var(--wash);color:var(--faint)}

  /* chat */
  .mchat{flex:1;min-height:0;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
  .mmsg{max-width:82%;font-size:14.5px;line-height:1.45;padding:10px 13px;border-radius:15px;text-wrap:pretty}
  .mmsg.me{align-self:flex-end;background:var(--ink-strong);color:#fff;border-bottom-right-radius:5px}
  .mmsg.ai{align-self:flex-start;background:var(--wash-light);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--subtle);font-style:italic}
  .mempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 42px;text-align:center;background:var(--surface)}
  .mempty .ic{color:var(--faint)}
  .mempty .h{font-size:16px;font-weight:600;letter-spacing:-.015em}
  .mempty .p{font-size:13.5px;color:var(--subtle);line-height:1.55;text-wrap:pretty}

  /* bottom nav (only where a variant keeps it) */
  .pnav{height:62px;flex-shrink:0;border-top:1px solid var(--line);background:rgba(255,255,255,.94);display:flex;align-items:center;padding:0 4px}
  .pnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--subtle);position:relative}
  .pnav a.on{color:var(--ink);font-weight:500}
  .pnav a i{width:19px;height:19px;border-radius:5px;background:var(--wash)}
  .pnav a.on i{background:var(--ink-strong)}
  .pnav .dot{position:absolute;top:-2px;right:24px;width:6px;height:6px;border-radius:50%;background:var(--danger)}

  /* the dashboard sitting behind a sheet */
  .behind{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
  .bhdr{height:48px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:9px}
  .bbody{flex:1;padding:14px;display:flex;flex-direction:column;gap:11px;min-height:0}
  .bkpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
  .bkpi .l{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;color:var(--subtle)}
  .bkpi .v{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
  .bcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:10px}
  .bchart{flex:1;display:flex;align-items:flex-end;gap:5px}
  .bchart i{flex:1;background:var(--ink-strong);border-radius:3px 3px 0 0}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.36);z-index:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);z-index:2;display:flex;flex-direction:column;
    border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);overflow:hidden}
  .grab{height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .grab i{width:38px;height:4px;border-radius:2px;background:var(--line-strong)}

  /* full-screen surfaces */
  .full{position:absolute;inset:0;z-index:2;background:var(--surface);display:flex;flex-direction:column}

  /* the raised compose sheet in variant 3 */
  .fab{position:absolute;right:18px;bottom:26px;width:54px;height:54px;border-radius:50%;background:var(--ink-strong);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.26);z-index:4}

  /* keyboard */
  .kbd{flex-shrink:0;background:#d4d6dc;padding:8px 5px 6px;display:flex;flex-direction:column;gap:7px}
  .kbd .kr{display:flex;gap:5px;justify-content:center}
  .kbd .kr span{height:34px;flex:1;background:#fff;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .kbd .kr span.w{flex:1.6}.kbd .kr span.x{flex:4.5}
  .kbd .bar{height:36px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#555}
  svg{display:block}
</style>
</head>
<body>

<div id="chrome">
  <span id="tag">Betty's · the panel on a phone</span>
  <div class="grp" id="variants"></div>
  <div id="desc"></div>
</div>
<div id="stage"></div>

<script>
"use strict";

const I = {
  chat:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  list:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="m17 12 2 2 4-4"/></svg>',
  x:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  xs:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  back:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  plus:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  chevr:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(-90deg)"><path d="m6 9 6 6 6-6"/></svg>',
  tick:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  send:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/></svg>',
  bubble:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
};

/* ── the real list, straight out of production ───────────────────── */
const NOTES = [
  "Foody's review feed stopped on 1 May while Foody kept selling.",
  "Social stats stop on 24 April. Marketing is parked until they come back.",
];
const TASKS = [
  { t:"Chase Wolt for the statement covering 6–15 June", money:"€1,264.32", src:"PAYOUTS" },
  { t:"Chase Wolt for the statement covering 26–31 August", money:"€526.52", src:"PAYOUTS" },
  { t:"Query the flat €71.40 Foody charge that is in no column", money:"€71.40", src:"PAYOUTS" },
  { t:"Set an hourly rate for Dinos", src:"PAYROLL" },
  { t:"Roll March into payroll — 166 h never recorded", src:"PAYROLL" },
  { t:"Add all four platform names for Sweet Potatoes", src:"MENU" },
  { t:"Add the till name for Halloumi Burger", src:"MENU" },
  { t:"Check whether the shop was shut on 17–18 August", src:"SALES" },
  { t:"Deactivate Vegetable Burger — never ordered, ever", src:"MENU" },
  { t:"Ask Bolt about 29 Dec – 4 Jan — 138% above normal", src:"PAYOUTS" },
  { t:"Ask Wolt about 21–25 July — 27% above normal", src:"PAYOUTS" },
  { t:"Add the Wolt name for “Chilled Coca Cola Regular Can, 330 ml”", src:"MENU" },
  { t:"Add the Wolt name for “Coca Cola Zero Can 330ml”", src:"MENU" },
  { t:"Add the Bolt name for whatever Bolt sells as “Chicken”", src:"MENU" },
  { t:"Add the till name for “MAYONNAISE”", src:"MENU" },
  { t:"Decide on Halloumi Burger — €8.00 on Foody and in store", src:"MENU" },
];
const SETTLING = { t:"Reprint the QR cards for the tables", when:"2 h ago" };
const DONE = [
  { t:"Print the new allergy sheet", when:"4 days ago" },
  { t:"Chase Foody for the April statement", src:"PAYOUTS", when:"11 days ago" },
];

/* ── row builders ────────────────────────────────────────────────── */
const meta = (o) => {
  const bits = [];
  if (o.money) bits.push('<span class="chip money">' + o.money + '</span>');
  if (o.src) bits.push('<span class="chip">' + o.src + '</span>');
  if (o.when) bits.push('<span class="when">' + o.when + '</span>');
  return bits.length ? '<div class="mmeta">' + bits.join("") + '</div>' : "";
};
const task = (o, opt = {}) =>
  '<div class="mrow' + (opt.done ? " isdone" : "") + '">' +
    '<div class="mbox' + (opt.done ? " done" : "") + '">' + (opt.done ? I.tick : "") + '</div>' +
    '<div class="mtxt"><div class="t">' + o.t + '</div>' + meta(o) + '</div>' +
    (opt.undo ? '<button class="mundo">Undo</button>' : "") +
    '<button class="mdel">' + I.xs + '</button>' +
  '</div>';
const note = (t) =>
  '<div class="mnote"><div class="bar"></div><div class="t">' + t + '</div>' +
  '<button class="mdel">' + I.xs + '</button></div>';
const head = (lbl, n, o = {}) =>
  '<div class="msh"><span class="lbl">' + lbl + '</span><span class="cnt">' + n + '</span>' +
  (o.act ? '<span class="act">' + o.act + '</span>' : '<span class="chev">' + (o.shut ? I.chevr : I.chev) + '</span>') +
  '</div>';

/* The list body, shared by every variant. `n` caps how many open tasks fit. */
const listBody = (n, o = {}) =>
  head("Notes", NOTES.length) +
  NOTES.map(note).join("") +
  head("To do", TASKS.length + 1) +
  TASKS.slice(0, n).map((t) => task(t)).join("") +
  (n < TASKS.length ? '<button class="mmore">Show ' + (TASKS.length - n) + ' more</button>' : "") +
  (o.settling ? task(SETTLING, { done: true, undo: true }) : "") +
  (o.done ? head("Done", DONE.length, { act: "Clear" }) + DONE.map((d) => task(d, { done: true })).join("") : "");

const filter = '<div class="mfilter"><div class="box">' + I.search + 'Filter 18 items…</div></div>';
const comp = (mode, o = {}) =>
  '<div class="mcomp">' +
    '<div class="mchips">' + (o.chips || ["Task", "Note"]).map((c) =>
      '<button class="' + (c === mode ? "on" : "") + '">' + c + '</button>').join("") + '</div>' +
    '<div class="minput' + (o.focus ? " focus" : "") + '">' + (o.text || (mode === "Note" ? "Write it down…" : mode === "Ask" ? "Ask about the numbers…" : "What needs doing?")) +
      '<span class="send' + (o.text ? "" : " off") + '">' + I.send + '</span></div>' +
  '</div>';
const chatComp = (o = {}) =>
  '<div class="mcomp"><div class="minput' + (o.focus ? " focus" : "") + '">' + (o.text || "Ask a question…") +
  '<span class="send' + (o.text ? "" : " off") + '">' + I.send + '</span></div></div>';
const chatBody = (o = {}) => o.empty
  ? '<div class="mempty"><span class="ic">' + I.bubble + '</span>' +
    '<div class="h">Ask about the numbers</div>' +
    '<div class="p">This is where questions about the dashboard will be answered. It is the shape of it only — nothing is connected behind it yet.</div></div>'
  : '<div class="mchat">' +
      '<div class="mmsg me">Which platform cost us the most in fees last month?</div>' +
      '<div class="mmsg ai">Not connected yet, so this went nowhere. An answer will appear here once it is.</div>' +
      '<div class="mmsg me">And how much is Wolt still owing us?</div>' +
      '<div class="mmsg ai">Not connected yet, so this went nowhere. An answer will appear here once it is.</div>' +
    '</div>';

const status = '<div class="status"><span>9:41</span><span>▮▮▮ ⌁</span></div>';
const homebar = '<div class="home"><i></i></div>';
const nav = (on) => '<div class="pnav">' +
  ["Overview", "Sales", "Reviews", "Notes", "More"].map((l) =>
    '<a class="' + (l === on ? "on" : "") + '"><i></i>' + l +
    (l === "Notes" ? '<span class="dot"></span>' : "") + '</a>').join("") + '</div>';

const behind = '<div class="behind">' + status +
  '<div class="bhdr"><div style="width:26px;height:26px;border-radius:8px;background:var(--wash)"></div>' +
  '<div style="font-size:14px;font-weight:500">Overview</div></div>' +
  '<div class="bbody"><div class="bkpi"><div class="l">NET REVENUE</div><div class="v">€8,043</div></div>' +
  '<div class="bcard"><div style="font-size:14px;font-weight:600">Revenue after fees</div>' +
  '<div class="bchart">' + [58,70,76,92,80,3,62].map((h) =>
    '<i style="height:' + h + '%' + (h < 5 ? ';background:var(--line-strong)' : "") + '"></i>').join("") + '</div></div></div>' +
  nav("Notes") + homebar + '</div>';

/* ── the four ────────────────────────────────────────────────────── */
const V = {};

/* 1 — a sheet that comes up over whatever you were reading */
V[1] = {
  name: "Sheet",
  desc: "<b>A sheet that rises over the page you were on.</b> Tapping Notes in the bottom bar does not navigate anywhere — the sheet comes up and covers the screen, bottom bar included, with the dashboard just visible behind the top corners so it is obvious you have not left it. Segmented switch and a close x in the header, composer welded to the bottom edge. Swipe down or tap x and you are back on Overview exactly where you were, same scroll position. <b>Best when the panel is a thing you dip into</b> — read a number, write it down, carry on.",
  frames: [
    ["Notes & to-do", behind + '<div class="scrim"></div>' +
      '<div class="sheet" style="top:40px">' +
        '<div class="grab"><i></i></div>' +
        '<div class="mhdr"><div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
          '<button class="iconbtn" style="margin-left:auto">' + I.x + '</button></div>' +
        '<div class="mseg"><button class="on">Notes &amp; to-do</button><button>Ask AI</button></div>' +
        filter +
        '<div class="mlist">' + listBody(5, { settling: true }) + '</div>' +
        comp("Task") + homebar +
      '</div>'],
    ["Ask AI", behind + '<div class="scrim"></div>' +
      '<div class="sheet" style="top:40px">' +
        '<div class="grab"><i></i></div>' +
        '<div class="mhdr"><div class="mtitle">Ask AI</div><div class="mcount">not connected yet</div>' +
          '<button class="iconbtn" style="margin-left:auto">' + I.x + '</button></div>' +
        '<div class="mseg"><button>Notes &amp; to-do</button><button class="on">Ask AI</button></div>' +
        chatBody({ empty: true }) + chatComp() + homebar +
      '</div>'],
    ["Typing", behind + '<div class="scrim"></div>' +
      '<div class="sheet" style="top:40px">' +
        '<div class="grab"><i></i></div>' +
        '<div class="mhdr"><div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
          '<button class="iconbtn" style="margin-left:auto">' + I.x + '</button></div>' +
        '<div class="mseg"><button class="on">Notes &amp; to-do</button><button>Ask AI</button></div>' +
        '<div class="mlist">' + listBody(3, {}) + '</div>' +
        comp("Task", { focus: true, text: '<span style="color:var(--ink)">Order more boxes before Friday</span>' }) +
        '<div class="kbd"><div class="kr">' + "<span></span>".repeat(10) + '</div>' +
          '<div class="kr">' + "<span></span>".repeat(9) + '</div>' +
          '<div class="kr"><span class="w"></span>' + "<span></span>".repeat(7) + '<span class="w"></span></div>' +
          '<div class="kr"><span class="w"></span><span class="x"></span><span class="w"></span></div>' +
          '<div class="bar">—</div></div>' +
      '</div>'],
  ],
};

/* 2 — its own screen, edge to edge, no bottom bar */
V[2] = {
  name: "Own screen",
  desc: "<b>Its own screen, edge to edge.</b> Still the /notes route, so back works and a link still opens it, but nothing else is on screen: no page title above a card, no bottom bar, no card border eating 32px of width. The header is the screen's own — back chevron, title, and one icon top right that swaps to the other mode in a single tap. The list runs full width; the composer sits on the bottom edge like a messaging app. <b>Best when the panel is somewhere you go and stay</b> — twenty minutes of working through the list.",
  frames: [
    ["Notes & to-do", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
        '<button class="iconbtn" style="margin-left:auto">' + I.chat + '</button></div>' +
      filter + '<div class="mlist">' + listBody(6, { settling: true }) + '</div>' +
      comp("Task") + homebar + '</div>'],
    ["Ask AI", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Ask AI</div><div class="mcount">not connected</div>' +
        '<button class="iconbtn" style="margin-left:auto">' + I.list + '<span style="position:absolute;margin:-18px 0 0 16px;width:6px;height:6px;border-radius:50%;background:var(--danger)"></span></button></div>' +
      chatBody() + chatComp() + homebar + '</div>'],
    ["Scrolled to Done", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
        '<button class="iconbtn" style="margin-left:auto">' + I.chat + '</button></div>' +
      '<div class="mlist">' + head("To do", TASKS.length + 1) + TASKS.slice(12).map((t) => task(t)).join("") +
        task(SETTLING, { done: true, undo: true }) +
        head("Done", 2, { act: "Clear" }) + DONE.map((d) => task(d, { done: true })).join("") + '</div>' +
      comp("Note") + homebar + '</div>'],
  ],
};

/* 3 — the list gets the whole screen; composing is a deliberate act */
V[3] = {
  name: "List first",
  desc: "<b>The list gets every pixel, and writing is a deliberate act.</b> No permanent composer at the bottom — that is 80px of empty input sitting there all day — so four more rows are visible at once. A round + bottom right raises a compose sheet when you actually have something to write. Two underlined tabs at the top, and you can swipe between them. Ask AI keeps its composer, because a chat without an input is not a chat. <b>Best if the list is long</b>, which yours is: 16 open.",
  frames: [
    ["Notes & to-do", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
        '<button class="iconbtn plain" style="margin-left:auto">' + I.search + '</button></div>' +
      '<div class="mtabs"><button class="on">Notes &amp; to-do</button><button>Ask AI</button></div>' +
      '<div class="mlist">' + listBody(8, { settling: true }) + '</div>' + homebar +
      '<button class="fab">' + I.plus + '</button></div>'],
    ["Writing one", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div></div>' +
      '<div class="mtabs"><button class="on">Notes &amp; to-do</button><button>Ask AI</button></div>' +
      '<div class="mlist">' + listBody(8, {}) + '</div></div>' +
      '<div class="scrim" style="z-index:3"></div>' +
      '<div class="sheet" style="z-index:4">' +
        '<div class="grab"><i></i></div>' +
        '<div style="padding:2px 16px 12px;display:flex;align-items:center;gap:10px">' +
          '<div style="font-size:16px;font-weight:600;letter-spacing:-.015em">New task</div>' +
          '<button class="iconbtn" style="margin-left:auto">' + I.x + '</button></div>' +
        '<div style="padding:0 16px"><div class="mchips"><button class="on">Task</button><button>Note</button></div>' +
        '<div class="minput focus" style="height:86px;align-items:flex-start;padding:12px;border-radius:13px">' +
          '<span style="color:var(--ink)">Order more boxes before Friday</span></div>' +
        '<button style="width:100%;height:44px;margin-top:12px;border-radius:11px;background:var(--ink-strong);color:#fff;font-size:15px;font-weight:500">Add task</button></div>' +
        '<div class="kbd" style="margin-top:12px"><div class="kr">' + "<span></span>".repeat(10) + '</div>' +
          '<div class="kr">' + "<span></span>".repeat(9) + '</div>' +
          '<div class="kr"><span class="w"></span>' + "<span></span>".repeat(7) + '<span class="w"></span></div>' +
          '<div class="kr"><span class="w"></span><span class="x"></span><span class="w"></span></div>' +
          '<div class="bar">—</div></div></div>'],
    ["Ask AI", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div></div>' +
      '<div class="mtabs"><button>Notes &amp; to-do</button><button class="on">Ask AI</button></div>' +
      chatBody() + chatComp() + homebar + '</div>'],
  ],
};

/* 4 — one surface, one input, three chips */
V[4] = {
  name: "One input",
  desc: "<b>One surface, one input, and the chip decides where what you type goes.</b> There are no tabs: Task and Note write a row, Ask sends it to the model and the thread takes over the screen. It is the smallest thing on the screen that switches mode, which means the switch is always under your thumb rather than at the top of a 800px screen. The risk is that Ask AI feels like a lesser third of the input rather than its own place — worth weighing, since the chat is the half that is not built yet.",
  frames: [
    ["Task", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div>' +
        '<button class="iconbtn plain" style="margin-left:auto">' + I.search + '</button></div>' +
      '<div class="mlist">' + listBody(7, { settling: true }) + '</div>' +
      comp("Task", { chips: ["Task", "Note", "Ask"] }) + homebar + '</div>'],
    ["Ask", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Ask AI</div><div class="mcount">not connected yet</div>' +
        '<button class="iconbtn plain" style="margin-left:auto">' + I.x + '</button></div>' +
      chatBody() +
      comp("Ask", { chips: ["Task", "Note", "Ask"] }) + homebar + '</div>'],
    ["Typing a note", '<div class="full">' + status +
      '<div class="mhdr"><button class="iconbtn plain" style="margin-left:-8px">' + I.back + '</button>' +
        '<div class="mtitle">Notes</div><div class="mcount">16 open</div></div>' +
      '<div class="mlist">' + listBody(3, {}) + '</div>' +
      comp("Note", { chips: ["Task", "Note", "Ask"], focus: true, text: '<span style="color:var(--ink)">Supplier quote for boxes — decide by the 20th</span>' }) +
      '<div class="kbd"><div class="kr">' + "<span></span>".repeat(10) + '</div>' +
        '<div class="kr">' + "<span></span>".repeat(9) + '</div>' +
        '<div class="kr"><span class="w"></span>' + "<span></span>".repeat(7) + '<span class="w"></span></div>' +
        '<div class="kr"><span class="w"></span><span class="x"></span><span class="w"></span></div>' +
        '<div class="bar">—</div></div></div>'],
  ],
};

/* ── chrome ──────────────────────────────────────────────────────── */
let cur = 1;
const stage = document.getElementById("stage");
const descEl = document.getElementById("desc");
const varEl = document.getElementById("variants");

function render() {
  const v = V[cur];
  descEl.innerHTML = "<b>" + cur + ". " + v.name + ".</b> " + v.desc;
  stage.innerHTML = '<div class="row">' + v.frames.map(([capt, inner]) =>
    '<div class="one"><div class="capt">' + capt + '</div>' +
    '<div class="phone">' + inner + '</div></div>').join("") + '</div>';
  [...varEl.children].forEach((b, i) => b.classList.toggle("on", i + 1 === cur));
}

Object.keys(V).forEach((k) => {
  const b = document.createElement("button");
  b.textContent = k + " · " + V[k].name;
  b.onclick = () => { cur = Number(k); render(); location.hash = k; };
  varEl.appendChild(b);
});
if (V[Number(location.hash.slice(1))]) cur = Number(location.hash.slice(1));
render();
</script>
</body>
</html>
